#
# Rendered by highfivelabs/krm-ci ci/krm/sync.py from ci/krm/callers/; do
# not edit here. Live tests of a pull request against the real test
# account, in krm-ci's krm-live.yml (docs/krm-ci.md, "Live runs"). A
# maintainer starts one with a comment whose first line is
#
#   /ok-to-test-live sha=<the full head SHA> [kinds=A,B] [sensitive=ok]
#
# and it runs only if hfl/security-review passed on that SHA and the `live`
# environment's reviewers approve. Off until HFL_LIVE_ENABLED is 'true'.
name: hfl-live

on:
  issue_comment: # zizmor: ignore[dangerous-triggers] gated by krm-live.yml's three locks; the pull request's code runs only after them
    types: [created]

permissions: {}

jobs:
  live:
    if: >-
      vars.HFL_LIVE_ENABLED == 'true' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/ok-to-test-live')
    uses: highfivelabs/krm-ci/.github/workflows/krm-live.yml@be81e851d513167fd0dae655e8f15583131edd10 # v1.2.1
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
      statuses: write
    with:
      ci-ref: be81e851d513167fd0dae655e8f15583131edd10
      environment: live
      setup-command: ""
      live-command: "task live:sandbox:vault && task live:vault"
      sweep-command: "task live:sandbox:vault:down"
      timeout-minutes: 45
      cloud: "none"
      target: ${{ vars.HFL_LIVE_TARGET }}
      gcp-workload-identity-provider: ${{ vars.HFL_LIVE_GCP_WIF_PROVIDER }}
      gcp-service-account: ${{ vars.HFL_LIVE_GCP_SERVICE_ACCOUNT }}
      aws-role-arn: ${{ vars.HFL_LIVE_AWS_ROLE_ARN }}
      azure-client-id: ${{ vars.HFL_LIVE_AZURE_CLIENT_ID }}
      azure-tenant-id: ${{ vars.HFL_LIVE_AZURE_TENANT_ID }}
      azure-subscription-id: ${{ vars.HFL_LIVE_AZURE_SUBSCRIPTION_ID }}
