terraform: [vault_secrets_sync_association]
kind: SecretsSyncAssociation
shape: upsert
params:
  type: {type: string}
  name: {type: string}
  mount: {type: string, inBody: true}
  secret_name: {type: string, inBody: true}
compareReturnedOnly: true
envelope: data
serverFields:
  sync_status: SYNCED
  updated_at: "2023-11-02T14:24:28.719833506-04:00"
sample: {type: gh, name: example-destination, mount: kv, secret_name: example-secret}
create: {method: POST, path: "/sys/sync/destinations/{type}/{name}/associations/set"}
read:
  method: GET
  path: /sys/sync/associations/destinations
  query: {mount: "{mount}", secret_name: "{secret_name}"}
  find: {list: data/associated_destinations, key: "{type}/{name}"}
delete:
  method: POST
  path: "/sys/sync/destinations/{type}/{name}/associations/remove"
  body: {mount: "{mount}", secret_name: "{secret_name}"}
