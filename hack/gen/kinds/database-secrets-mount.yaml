terraform: [vault_database_secrets_mount]
kind: DatabaseSecretsMount
shape: set
params:
  path: {type: string}
fields:
  description: {type: string}
  config:
    type: object
    x-kubernetes-preserve-unknown-fields: true
  local: {type: boolean}
  seal_wrap: {type: boolean}
  external_entropy_access: {type: boolean}
  connections:
    type: array
    items:
      type: object
      x-kubernetes-preserve-unknown-fields: true
      required: [name, plugin_name]
      properties:
        name: {type: string}
        plugin_name: {type: string}
        connection_url: {type: string}
        username: {type: string}
        password: {type: string}
        allowed_roles:
          type: array
          items: {type: string}
        verify_connection: {type: boolean}
compareReturnedOnly: true
set:
  field: connections
  key: name
  param: name
  list: data/keys
  readEach: {method: GET, path: "/{path}/config/{name}", envelope: data}
  holder:
    create: {method: POST, path: "/sys/mounts/{path}", body: {type: database}}
    read: {method: GET, path: "/sys/mounts/{path}"}
    delete: {method: DELETE, path: "/sys/mounts/{path}"}
    fields: [description, config, local, seal_wrap, external_entropy_access]
sample:
  path: database
  description: example databases
  connections:
  - {name: example-postgres, plugin_name: postgresql-database-plugin, connection_url: "host=db.example.com port=5432 dbname=app user={{username}}", username: vault, allowed_roles: [app]}
  - {name: example-mysql, plugin_name: mysql-database-plugin, connection_url: "{{username}}@tcp(db.example.com:3306)/", username: vault, allowed_roles: [app]}
read: {method: GET, path: "/{path}/config", query: {list: "true"}}
create: {method: POST, path: "/{path}/config/{name}"}
update: {method: POST, path: "/{path}/config/{name}"}
delete: {method: DELETE, path: "/{path}/config/{name}"}
