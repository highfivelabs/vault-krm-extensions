components:
  schemas:
    AgentRegistrationRequest:
      type: object
      required: [display_name, entity_id]
      properties:
        display_name:
          type: string
        entity_id:
          type: string
        ceiling_policies:
          type: array
          items:
            type: string
        no_default_ceiling_policy:
          type: boolean
        description:
          type: string
        owner:
          type: string
        optional_authorization_details:
          type: boolean
        local:
          type: boolean
    AgentRegistrationResponse:
      type: object
      properties:
        id:
          type: string
        display_name:
          type: string
        entity_id:
          type: string
        ceiling_policies:
          type: array
          items:
            type: string
        no_default_ceiling_policy:
          type: boolean
        description:
          type: string
        owner:
          type: string
        optional_authorization_details:
          type: boolean
        local:
          type: boolean
        creation_time:
          type: string
        last_updated_time:
          type: string
    ConfigControlGroupRequest:
      type: object
      properties:
        max_ttl:
          type: string
          format: duration
    ConfigControlGroupResponse:
      type: object
      properties:
        max_ttl:
          type: string
          format: duration
    ConfigGroupPolicyApplicationRequest:
      type: object
      properties:
        group_policy_application_mode:
          type: string
          enum:
          - within_namespace_hierarchy
          - any
      required:
      - group_policy_application_mode
    ConfigGroupPolicyApplicationResponse:
      type: object
      properties:
        group_policy_application_mode:
          type: string
          enum:
          - within_namespace_hierarchy
          - any
    PoliciesEgpRequest:
      type: object
      properties:
        policy:
          type: string
        enforcement_level:
          type: string
          enum:
          - advisory
          - soft-mandatory
          - hard-mandatory
        paths:
          type: array
          items:
            type: string
      required:
      - policy
      - enforcement_level
      - paths
    PoliciesEgpResponse:
      type: object
      properties:
        policy:
          type: string
        enforcement_level:
          type: string
          enum:
          - advisory
          - soft-mandatory
          - hard-mandatory
        paths:
          type: array
          items:
            type: string
    PoliciesRgpRequest:
      type: object
      properties:
        policy:
          type: string
        enforcement_level:
          type: string
          enum:
          - advisory
          - soft-mandatory
          - hard-mandatory
      required:
      - policy
      - enforcement_level
    PoliciesRgpResponse:
      type: object
      properties:
        policy:
          type: string
        enforcement_level:
          type: string
          enum:
          - advisory
          - soft-mandatory
          - hard-mandatory
    ManagedKeysRequest:
      type: object
      properties:
        allow_generate_key:
          type: boolean
        allow_replace_key:
          type: boolean
        allow_store_key:
          type: boolean
        any_mount:
          type: boolean
        usages:
          type: string
        library:
          type: string
        key_label:
          type: string
        key_id:
          type: string
        mechanism:
          type: string
        pin:
          type: string
        slot:
          type: string
        token_label:
          type: string
        curve:
          type: string
        key_bits:
          type: string
        force_rw_session:
          type: boolean
        max_parallel:
          type: integer
        rsa_oaep_hash:
          type: string
        access_key:
          type: string
        secret_key:
          type: string
        endpoint:
          type: string
        key_type:
          type: string
          description: 'awskms: RSA or ECDSA; azurekeyvault: RSA-HSM.'
        kms_key:
          type: string
        region:
          type: string
        tenant_id:
          type: string
        client_id:
          type: string
        client_secret:
          type: string
        environment:
          type: string
        vault_name:
          type: string
        key_name:
          type: string
        resource:
          type: string
        encryption_mode:
          type: string
        credentials:
          type: string
        crypto_key:
          type: string
        crypto_key_version:
          type: string
        key_ring:
          type: string
        project:
          type: string
        algorithm:
          type: string
    MfaMethodDuoRequest:
      type: object
      properties:
        mount_accessor:
          type: string
        username_format:
          type: string
        secret_key:
          type: string
        integration_key:
          type: string
        api_hostname:
          type: string
          description: API hostname for Duo.
        push_info:
          type: string
      required:
      - mount_accessor
      - secret_key
      - integration_key
      - api_hostname
    MfaMethodDuoResponse:
      type: object
      properties:
        mount_accessor:
          type: string
        username_format:
          type: string
        api_hostname:
          type: string
          description: API hostname for Duo.
    MfaMethodOktaRequest:
      type: object
      properties:
        mount_accessor:
          type: string
        username_format:
          type: string
        org_name:
          type: string
          description: Name of the organization to be used in the Okta API.
        api_token:
          type: string
          description: Okta API key.
        base_url:
          type: string
        primary_email:
          type: boolean
      required:
      - mount_accessor
      - org_name
      - api_token
    MfaMethodOktaResponse:
      type: object
      properties:
        mount_accessor:
          type: string
        username_format:
          type: string
        org_name:
          type: string
          description: Name of the organization to be used in the Okta API.
        base_url:
          type: string
        primary_email:
          type: boolean
    MfaMethodPingidRequest:
      type: object
      properties:
        mount_accessor:
          type: string
        username_format:
          type: string
        settings_file_base64:
          type: string
      required:
      - mount_accessor
      - settings_file_base64
    MfaMethodTotpRequest:
      type: object
      properties:
        issuer:
          type: string
          description: The name of the key's issuing organization.
        period:
          type: string
          format: duration
        key_size:
          type: integer
          description: The size in bytes of the generated key (default 20).
        qr_size:
          type: integer
          description: The pixel size of the generated square QR code (default 200).
        algorithm:
          type: string
          enum:
          - SHA1
          - SHA256
          - SHA512
        digits:
          type: integer
        skew:
          type: integer
        max_validation_attempts:
          type: integer
      required:
      - issuer
    MfaMethodTotpResponse:
      type: object
      properties:
        issuer:
          type: string
          description: The name of the key's issuing organization.
        period:
          type: string
          format: duration
        key_size:
          type: integer
          description: The size in bytes of the generated key (default 20).
        qr_size:
          type: integer
          description: The pixel size of the generated square QR code (default 200).
        algorithm:
          type: string
          enum:
          - SHA1
          - SHA256
          - SHA512
        digits:
          type: integer
        skew:
          type: integer
        max_validation_attempts:
          type: integer
    RaftAutopilotConfigurationRequest:
      type: object
      properties:
        cleanup_dead_servers:
          type: boolean
        last_contact_threshold:
          type: string
        dead_server_last_contact_threshold:
          type: string
        max_trailing_logs:
          type: integer
        min_quorum:
          type: integer
        server_stabilization_time:
          type: string
        disable_upgrade_migration:
          type: boolean
    RaftAutopilotConfigurationResponse:
      type: object
      properties:
        cleanup_dead_servers:
          type: boolean
        last_contact_threshold:
          type: string
        dead_server_last_contact_threshold:
          type: string
        max_trailing_logs:
          type: integer
        min_quorum:
          type: integer
        server_stabilization_time:
          type: string
        disable_upgrade_migration:
          type: boolean
    RaftSnapshotAutoConfigRequest:
      type: object
      properties:
        interval:
          type: string
          format: duration
        retain:
          type: integer
        path_prefix:
          type: string
        file_prefix:
          type: string
        storage_type:
          type: string
          enum:
          - local
          - azure-blob
          - aws-s3
          - google-gcs
        autoload_enabled:
          type: boolean
        local_max_space:
          type: integer
        aws_s3_bucket:
          type: string
        aws_s3_region:
          type: string
        aws_access_key_id:
          type: string
          description: AWS access key ID.
        aws_secret_access_key:
          type: string
          description: AWS secret access key.
        aws_session_token:
          type: string
          description: AWS session token.
        aws_s3_endpoint:
          type: string
        aws_s3_disable_tls:
          type: boolean
        aws_s3_force_path_style:
          type: boolean
        aws_s3_enable_kms:
          type: boolean
