openapi: 3.0.2
info:
  title: Vault Transform secrets engine (Vault Enterprise)
  version: 1.0.0
  description: Hand-made supplement to the Vault OpenAPI document; see the comment at the top.
paths:
  /{transform_mount_path}/alphabet/{name}:
    parameters:
    - name: transform_mount_path
      description: Path that the backend was mounted at
      in: path
      schema:
        type: string
        default: transform
      required: true
    - name: name
      in: path
      schema:
        type: string
      required: true
    get:
      summary: Read a Transform alphabet.
      operationId: read-transform-alphabet
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransformAlphabetResponse'
    post:
      summary: Create or update a Transform alphabet.
      operationId: write-transform-alphabet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransformAlphabetRequest'
      responses:
        '200':
          description: OK
        '204':
          description: empty body
    delete:
      summary: Delete a Transform alphabet.
      operationId: delete-transform-alphabet
      responses:
        '204':
          description: empty body
  /{transform_mount_path}/template/{name}:
    parameters:
    - name: transform_mount_path
      description: Path that the backend was mounted at
      in: path
      schema:
        type: string
        default: transform
      required: true
    - name: name
      in: path
      schema:
        type: string
      required: true
    get:
      summary: Read a Transform template.
      operationId: read-transform-template
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransformTemplateResponse'
    post:
      summary: Create or update a Transform template.
      operationId: write-transform-template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransformTemplateRequest'
      responses:
        '200':
          description: OK
        '204':
          description: empty body
    delete:
      summary: Delete a Transform template.
      operationId: delete-transform-template
      responses:
        '204':
          description: empty body
  /{transform_mount_path}/transformation/{name}:
    parameters:
    - name: transform_mount_path
      description: Path that the backend was mounted at
      in: path
      schema:
        type: string
        default: transform
      required: true
    - name: name
      in: path
      schema:
        type: string
      required: true
    get:
      summary: Read a Transform transformation.
      operationId: read-transform-transformation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransformTransformationResponse'
    post:
      summary: Create or update a Transform transformation.
      operationId: write-transform-transformation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransformTransformationRequest'
      responses:
        '200':
          description: OK
        '204':
          description: empty body
    delete:
      summary: Delete a Transform transformation.
      operationId: delete-transform-transformation
      responses:
        '204':
          description: empty body
  /{transform_mount_path}/transformations/tokenization/{name}:
    parameters:
    - name: transform_mount_path
      description: Path that the backend was mounted at
      in: path
      schema:
        type: string
        default: transform
      required: true
    - name: name
      in: path
      schema:
        type: string
      required: true
    get:
      summary: Read a Transform tokenization transformation.
      operationId: read-transform-transformations-tokenization
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransformTransformationsTokenizationResponse'
    post:
      summary: Create or update a Transform tokenization transformation.
      operationId: write-transform-transformations-tokenization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransformTransformationsTokenizationRequest'
      responses:
        '200':
          description: OK
        '204':
          description: empty body
    delete:
      summary: Delete a Transform tokenization transformation.
      operationId: delete-transform-transformations-tokenization
      responses:
        '204':
          description: empty body
  /{transform_mount_path}/tokenization/keys/{name}:
    parameters:
    - name: transform_mount_path
      description: Path that the backend was mounted at
      in: path
      schema:
        type: string
        default: transform
      required: true
    - name: name
      in: path
      schema:
        type: string
      required: true
    get:
      summary: Read a tokenization key's configuration.
      operationId: read-transform-tokenization-key
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransformTokenizationKeyResponse'
  /{transform_mount_path}/tokenization/keys/{name}/config:
    parameters:
    - name: transform_mount_path
      description: Path that the backend was mounted at
      in: path
      schema:
        type: string
        default: transform
      required: true
    - name: name
      in: path
      schema:
        type: string
      required: true
    post:
      summary: Configure a tokenization key.
      operationId: write-transform-tokenization-key-config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransformTokenizationKeyConfigRequest'
      responses:
        '200':
          description: OK
        '204':
          description: empty body
  /{transform_mount_path}/stores/{name}:
    parameters:
    - name: transform_mount_path
      description: Path that the backend was mounted at
      in: path
      schema:
