        '204':
          description: empty body
    delete:
      summary: Delete a Transform tokenization store.
      operationId: delete-transform-stores
      responses:
        '204':
          description: empty body
  /{transform_mount_path}/role/{name}:
    parameters:
    - name: transform_mount_path
      description: Path that the backend was mounted at
      in: path
      schema:
        type: string
        default: transform
      required: true
    - name: name
      in: path
      schema:
        type: string
      required: true
    get:
      summary: Read a Transform role.
      operationId: read-transform-role
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransformRoleResponse'
    post:
      summary: Create or update a Transform role.
      operationId: write-transform-role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransformRoleRequest'
      responses:
        '200':
          description: OK
        '204':
          description: empty body
    delete:
      summary: Delete a Transform role.
      operationId: delete-transform-role
      responses:
        '204':
          description: empty body
components:
  schemas:
    TransformTokenizationKeyConfigRequest:
      type: object
      properties:
        min_decryption_version:
          type: integer
        auto_rotate_period:
    TransformTokenizationKeyResponse:
      type: object
      properties:
        name:
          type: string
        latest_version:
          type: integer
        min_available_version:
          type: integer
        min_decryption_version:
          type: integer
        auto_rotate_period:
    TransformAlphabetRequest:
      type: object
      properties:
        alphabet:
          type: string
      required:
      - alphabet
    TransformAlphabetResponse:
      type: object
      properties:
        alphabet:
          type: string
    TransformTemplateRequest:
      type: object
      properties:
        type:
          type: string
          enum:
          - regex
        pattern:
          type: string
        alphabet:
          type: string
        encode_format:
          type: string
        decode_formats:
          type: object
          additionalProperties:
            type: string
      required:
      - type
      - pattern
    TransformTemplateResponse:
      type: object
      properties:
        type:
          type: string
          enum:
          - regex
        pattern:
          type: string
        alphabet:
          type: string
        encode_format:
          type: string
        decode_formats:
          type: object
          additionalProperties:
            type: string
    TransformTransformationRequest:
      type: object
      properties:
        type:
          type: string
          enum:
          - fpe
          - masking
          - tokenization
        template:
          type: string
        tweak_source:
          type: string
          enum:
          - supplied
          - generated
          - internal
        masking_character:
          type: string
        allowed_roles:
          type: array
          items:
            type: string
        deletion_allowed:
          type: boolean
        mapping_mode:
          type: string
        stores:
          type: array
          items:
            type: string
        convergent:
          type: boolean
        max_tweak_len:
          type: integer
      required:
      - type
    TransformTransformationResponse:
      type: object
      properties:
        type:
          type: string
          enum:
          - fpe
          - masking
          - tokenization
        tweak_source:
          type: string
          enum:
          - supplied
          - generated
          - internal
        masking_character:
          type: string
        allowed_roles:
          type: array
          items:
            type: string
        deletion_allowed:
          type: boolean
        mapping_mode:
          type: string
        stores:
          type: array
          items:
            type: string
        convergent:
          type: boolean
        max_tweak_len:
          type: integer
    TransformTransformationsTokenizationRequest:
      type: object
      properties:
        mapping_mode:
          type: string
          enum:
          - default
          - exportable
        convergent:
          type: boolean
        max_ttl:
          type: string
          format: duration
        allowed_roles:
          type: array
          items:
            type: string
        stores:
          type: array
          items:
            type: string
        deletion_allowed:
          type: boolean
    TransformTransformationsTokenizationResponse:
      type: object
      properties:
        mapping_mode:
          type: string
          enum:
          - default
          - exportable
        max_ttl:
          type: string
          format: duration
        allowed_roles:
          type: array
          items:
            type: string
        stores:
          type: array
          items:
            type: string
        deletion_allowed:
          type: boolean
    TransformStoresRequest:
      type: object
      properties:
        type:
          type: string
          enum:
          - sql
        driver:
          type: string
          enum:
          - postgres
          - mysql
          - mssql
        connection_string:
          type: string
        username:
          type: string
        password:
          type: string
        supported_transformations:
          type: array
          items:
            type: string
        schema:
          type: string
        max_open_connections:
          type: integer
        max_idle_connections:
          type: integer
        max_connection_lifetime:
          type: string
          format: duration
      required:
      - type
      - driver
      - connection_string
      - username
      - password
    TransformStoresResponse:
      type: object
      properties:
        driver:
          type: string
          enum:
          - postgres
          - mysql
          - mssql
        connection_string:
          type: string
        supported_transformations:
          type: array
          items:
            type: string
    TransformRoleRequest:
      type: object
      properties:
        transformations:
          type: array
          items:
            type: string
    TransformRoleResponse:
      type: object
      properties:
        transformations:
          type: array
          items:
            type: string
