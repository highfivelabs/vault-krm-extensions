  /{pki_external_ca_mount_path}/config/dns/rfc2136/{name}:
    parameters:
    - name: pki_external_ca_mount_path
      description: Path that the backend was mounted at
      in: path
      schema:
        type: string
        default: pki-external-ca
      required: true
    - name: name
      in: path
      schema:
        type: string
      required: true
    get:
      summary: Read an RFC 2136 (dynamic DNS update) provider of the PKI External CA engine.
      operationId: read-pki-external-ca-dns-rfc2136
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
