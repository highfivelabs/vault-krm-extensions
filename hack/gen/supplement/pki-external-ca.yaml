openapi: 3.0.2
info:
  title: Vault PKI External CA secrets engine (Vault Enterprise)
  version: 1.0.0
  description: Hand-made supplement to the Vault OpenAPI document; see the comment at the top.
paths:
  /{pki_external_ca_mount_path}/role/{name}:
    parameters:
    - name: pki_external_ca_mount_path
      description: Path that the backend was mounted at
      in: path
      schema:
        type: string
        default: pki-external-ca
      required: true
    - name: name
      in: path
      schema:
        type: string
      required: true
    get:
      summary: Read a PKI External CA role.
      operationId: read-pki-external-ca-role
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PkiExternalCaRoleResponse'
    post:
      summary: Create or update a PKI External CA role.
      operationId: write-pki-external-ca-role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PkiExternalCaRoleRequest'
      responses:
        '200':
          description: OK
        '204':
          description: empty body
    delete:
      summary: Delete a PKI External CA role.
      operationId: delete-pki-external-ca-role
      responses:
        '204':
          description: empty body
