    post:
      summary: Create or update an AWS Route53 DNS provider of the PKI External CA engine.
      operationId: write-pki-external-ca-dns-aws-route53
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PkiExternalCaDnsAwsRoute53Request'
      responses:
        '200':
          description: OK
        '204':
          description: empty body
    delete:
