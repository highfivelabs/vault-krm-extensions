openapi: 3.0.2
info:
  title: Vault SPIFFE secrets engine (Vault Enterprise)
  version: 1.0.0
  description: Hand-made supplement to the Vault OpenAPI document; see the comment at the top.
paths:
  /{spiffe_mount_path}/config:
    parameters:
    - name: spiffe_mount_path
      description: Path that the backend was mounted at
      in: path
      schema:
        type: string
        default: spiffe
      required: true
    get:
      summary: Read the SPIFFE secrets engine's configuration.
      operationId: read-spiffe-config
      responses:
        '200':
          description: OK
    post:
      summary: Create or update the SPIFFE secrets engine's configuration.
      operationId: write-spiffe-config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpiffeConfigRequest'
      responses:
        '200':
          description: OK
        '204':
          description: empty body
  /{spiffe_mount_path}/role/{name}:
    parameters:
    - name: spiffe_mount_path
      description: Path that the backend was mounted at
      in: path
      schema:
        type: string
        default: spiffe
      required: true
    - name: name
      in: path
      schema:
        type: string
      required: true
    get:
      summary: Read a SPIFFE secrets role.
      operationId: read-spiffe-role
      responses:
        '200':
          description: OK
    post:
      summary: Create or update a SPIFFE secrets role.
      operationId: write-spiffe-role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpiffeRoleRequest'
      responses:
        '200':
          description: OK
        '204':
          description: empty body
    delete:
      summary: Delete a SPIFFE secrets role.
      operationId: delete-spiffe-role
      responses:
        '204':
          description: empty body
components:
  schemas:
    SpiffeConfigRequest:
      type: object
      properties:
        trust_domain:
          type: string
        bundle_refresh_hint:
          type: string
          format: duration
        key_lifetime:
          type: string
          format: duration
        jwt_issuer_url:
          type: string
        jwt_signing_algorithm:
          type: string
          description: Signing algorithm.
          enum:
          - RS256
          - RS384
          - RS512
          - ES256
          - ES384
          - ES512
        jwt_oidc_compatibility_mode:
          type: boolean
      required:
      - trust_domain
    SpiffeRoleRequest:
      type: object
      properties:
        template:
          type: string
        ttl:
          type: string
          format: duration
        use_jti_claim:
          type: boolean
      required:
      - template
