components:
  schemas:
    SyncConfigRequest:
      type: object
      properties:
        disabled:
          type: boolean
        queue_capacity:
          type: integer
    SyncConfigResponse:
      type: object
      properties:
        disabled:
          type: boolean
        queue_capacity:
          type: integer
    SyncDestinationsAwsSmRequest:
      type: object
      properties:
        access_key_id:
          type: string
        secret_access_key:
          type: string
        role_arn:
          type: string
        external_id:
          type: string
        region:
          type: string
        kms_key_id:
          type: string
        replica_regions:
          type: object
          additionalProperties:
            type: string
        secret_name_template:
          type: string
        custom_tags:
          type: object
          additionalProperties:
            type: string
        granularity:
          type: string
          enum:
          - secret-path
          - secret-key
        identity_token_audience:
          type: string
        identity_token_key:
          type: string
        identity_token_ttl:
          type: string
          format: duration
        disable_strict_networking:
          type: boolean
        allowed_ipv4_addresses:
          type: array
          items:
            type: string
        allowed_ipv6_addresses:
          type: array
          items:
            type: string
        allowed_ports:
          type: array
          items:
            type: integer
    SyncDestinationsAwsSmResponse:
      type: object
      properties:
        connection_details:
          type: object
        options:
          type: object
    SyncDestinationsAzureKvRequest:
      type: object
      properties:
        key_vault_uri:
          type: string
        client_id:
          type: string
        client_secret:
          type: string
        tenant_id:
          type: string
        cloud:
          type: string
        secret_name_template:
          type: string
        custom_tags:
          type: object
          additionalProperties:
            type: string
        granularity:
          type: string
          enum:
          - secret-path
          - secret-key
        identity_token_audience:
          type: string
        identity_token_key:
          type: string
        identity_token_ttl:
          type: string
          format: duration
        disable_strict_networking:
          type: boolean
        allowed_ipv4_addresses:
          type: array
          items:
            type: string
        allowed_ipv6_addresses:
          type: array
          items:
            type: string
        allowed_ports:
          type: array
          items:
            type: integer
      required:
      - key_vault_uri
      - client_id
      - tenant_id
    SyncDestinationsAzureKvResponse:
      type: object
      properties:
        connection_details:
          type: object
        options:
          type: object
    SyncDestinationsGcpSmRequest:
      type: object
      properties:
        credentials:
          type: string
        project_id:
          type: string
        kms_key_id:
          type: string
        replica_regions:
          type: object
          additionalProperties:
            type: string
        replication_locations:
          type: array
          items:
            type: string
        locational_kms_keys:
          type: object
          additionalProperties:
            type: string
        global_kms_key:
          type: string
        service_account_email:
          type: string
        secret_name_template:
          type: string
        custom_tags:
          type: object
          additionalProperties:
            type: string
        granularity:
          type: string
          enum:
          - secret-path
          - secret-key
        identity_token_audience:
          type: string
        identity_token_key:
          type: string
        identity_token_ttl:
          type: string
          format: duration
        disable_strict_networking:
          type: boolean
        allowed_ipv4_addresses:
          type: array
          items:
            type: string
        allowed_ipv6_addresses:
          type: array
          items:
            type: string
        allowed_ports:
          type: array
          items:
            type: integer
    SyncDestinationsGcpSmResponse:
      type: object
      properties:
        connection_details:
          type: object
        options:
          type: object
    SyncDestinationsGhRequest:
      type: object
      properties:
        enterprise_url:
          type: string
        secrets_location:
          type: string
          enum:
          - organization
          - repository
        access_token:
          type: string
        app_name:
          type: string
        installation_id:
          type: string
        repository_owner:
          type: string
        repository_name:
          type: string
        environment_name:
          type: string
        organization_name:
          type: string
        organization_visibility:
          type: string
          enum:
          - all
          - private
          - selected
        selected_repository_names:
          type: array
          items:
            type: string
        secret_name_template:
          type: string
        granularity:
          type: string
          enum:
          - secret-path
          - secret-key
        disable_strict_networking:
          type: boolean
        allowed_ipv4_addresses:
          type: array
          items:
            type: string
        allowed_ipv6_addresses:
          type: array
          items:
            type: string
        allowed_ports:
          type: array
          items:
            type: integer
    SyncDestinationsGhResponse:
      type: object
      properties:
        connection_details:
          type: object
        options:
          type: object
    SyncDestinationsVercelProjectRequest:
      type: object
      properties:
        access_token:
          type: string
        project_id:
          type: string
        team_id:
          type: string
        deployment_environments:
          type: array
          items:
            type: string
        secret_name_template:
          type: string
        granularity:
          type: string
          enum:
          - secret-path
          - secret-key
        disable_strict_networking:
          type: boolean
        allowed_ipv4_addresses:
          type: array
          items:
            type: string
        allowed_ipv6_addresses:
          type: array
          items:
            type: string
        allowed_ports:
          type: array
          items:
            type: integer
      required:
      - access_token
      - project_id
      - deployment_environments
    SyncDestinationsVercelProjectResponse:
      type: object
      properties:
        connection_details:
          type: object
        options:
          type: object
    SyncGithubAppsRequest:
      type: object
      properties:
        app_id:
          type: integer
        private_key:
          type: string
      required:
      - app_id
      - private_key
    SyncGithubAppsResponse:
      type: object
      properties:
        app_id:
          type: integer
