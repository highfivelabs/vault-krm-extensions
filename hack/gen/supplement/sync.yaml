openapi: 3.0.2
info:
  title: Vault secrets sync (Vault Enterprise)
  version: 1.0.0
  description: Hand-made supplement to the Vault OpenAPI document; see the comment at the top.
paths:
  /sys/sync/config:
    parameters: []
    get:
      summary: Read the secrets sync configuration (Vault Enterprise).
      operationId: read-sync-config
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncConfigResponse'
    patch:
      summary: Update the secrets sync configuration (Vault Enterprise).
      operationId: patch-sync-config
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/SyncConfigRequest'
      responses:
        '200':
          description: OK
        '204':
          description: empty body
  /sys/sync/destinations/aws-sm/{name}:
    parameters:
    - name: name
      in: path
      schema:
        type: string
      required: true
    get:
      summary: Read a secrets sync destination for AWS Secrets Manager (Vault Enterprise).
      operationId: read-sync-destinations-aws-sm
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncDestinationsAwsSmResponse'
    post:
      summary: Create or update a secrets sync destination for AWS Secrets Manager (Vault Enterprise).
      operationId: write-sync-destinations-aws-sm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncDestinationsAwsSmRequest'
      responses:
        '200':
          description: OK
        '204':
          description: empty body
    delete:
      summary: Delete a secrets sync destination for AWS Secrets Manager (Vault Enterprise).
      operationId: delete-sync-destinations-aws-sm
      responses:
        '204':
          description: empty body
